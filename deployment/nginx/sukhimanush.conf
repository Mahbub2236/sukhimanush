# ==============================================================================
# Nginx Server Configuration for Sukhi Manush (Laravel 12 + Vue 3 SPA)
# ==============================================================================
# Location on server: /etc/nginx/sites-available/sukhimanush.conf
# Symlink: ln -s /etc/nginx/sites-available/sukhimanush.conf /etc/nginx/sites-enabled/
# Test config: nginx -t && systemctl reload nginx
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sukhimanush.com www.sukhimanush.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/sukhimanush/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sukhimanush.com www.sukhimanush.com;

    root /var/www/sukhimanush/public;
    index index.php index.html;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sukhimanush.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sukhimanush.com/privkey.pem;

    # TLS Protocols & Modern Cipher Suite
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # SSL Session Caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Max upload size (Set to 25MB to accommodate medical report PDFs & images)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/sukhimanush_access.log;
    error_log /var/log/nginx/sukhimanush_error.log warn;

    # Charset
    charset utf-8;

    # Primary routing: Try static files first, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite compiled assets caching (immutable cache with hash)
    location ^~ /build/assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static media caching (images, fonts, css, js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Laravel health check endpoint (fast response, optional access log silencing)
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # FastCGI PHP-FPM processing
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # FastCGI Buffers for large JSON/Report payloads
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Security Hardening Blocks
    # --------------------------------------------------------------------------

    # Deny access to hidden dotfiles (.git, .env, .htaccess, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Strictly forbid direct access to sensitive framework directories
    location ~ ^/(storage/app/private|vendor|bootstrap/cache|database|tests|node_modules) {
        deny all;
        return 404;
    }

    # Disallow PHP file execution in uploads directory
    location ~ ^/storage/.*\.(?:php|phtml|phar|sh|pl|py|cgi)$ {
        deny all;
        return 403;
    }

    # Error handling
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
