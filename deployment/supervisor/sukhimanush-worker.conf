# ==============================================================================
# Supervisor Process Configuration for Sukhi Manush Queue Workers
# ==============================================================================
# Location on server: /etc/supervisor/conf.d/sukhimanush-worker.conf
# Reload commands:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start sukhimanush-worker:*
#   sudo supervisorctl status
# ==============================================================================

[program:sukhimanush-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sukhimanush/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sukhimanush-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600
