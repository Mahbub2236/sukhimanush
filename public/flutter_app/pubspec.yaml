name: novena_health_app
description: "Novena & Mahriva Next-Gen Hospital, Doctor SaaS & Telehealth Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & REST API
  dio: ^5.4.1
  http: ^1.2.1

  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Design, Typography & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  glassmorphism: ^3.0.0

  # Charts & Visuals
  fl_chart: ^0.66.2

  # QR Code & Media
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  audioplayers: ^5.2.1

  # Date, Time & Localization
  intl: ^0.19.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
